# EngCalc – build an Android APK automatically on every push.
# Download: GitHub ▸ Actions ▸ latest "Build APK" run ▸ Artifacts ▸ EngCalc-apk
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: EngCalc
      APP_ID: com.arif.engcalc
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Get the app files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web app into www/
        run: |
          mkdir -p www
          cp index.html app.js engine.js data.js manifest.webmanifest sw.js www/
          cp -r icons fonts www/

      - name: Create the Android project (Capacitor)
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android

      - name: App icon & splash from icons/icon-512.png
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/logo.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#0B1118' --splashBackgroundColorDark '#0B1118' || echo "icon step skipped"

      - name: Sync web files and set version
        run: |
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          chmod +x android/gradlew

      - name: Build APK (debug – no key needed)
        if: env.HAS_KEY != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../EngCalc.apk

      - name: Build signed APK (release – uses your secret key)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cd android
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ../release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out ../EngCalc.apk aligned.apk
          rm -f ../release.jks

      - name: Upload APK (Actions ▸ Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EngCalc-apk
          path: EngCalc.apk
          retention-days: 30
