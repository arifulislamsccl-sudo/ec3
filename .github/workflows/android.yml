name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild calculators from the Excel file
        run: |
          pip install -r tools/requirements.txt
          python tools/build_model.py excel/EngCalc_Source.xlsx www/js/model.js
          python tools/build_ui.py excel/EngCalc_Source.xlsx www/js/ui.js

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: |
          [ -d android ] || npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set app version (versionCode = run number)
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/EngCalc-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EngCalc-debug-apk
          path: EngCalc-debug.apk

      - name: Build signed release (APK + AAB for Play Store)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/EngCalc-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/EngCalc-release.aab"

      - name: Upload signed release
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: EngCalc-release
          path: |
            EngCalc-release.apk
            EngCalc-release.aab

      - name: Publish on the Releases page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EngCalc-debug.apk
            EngCalc-release.apk
          fail_on_unmatched_files: false
