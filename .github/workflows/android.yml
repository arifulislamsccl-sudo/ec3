name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the web app into www
        run: |
          mkdir -p app-build/www
          tar --exclude=./.git --exclude=./.github --exclude=./app-build --exclude=./README.md -cf - . | (cd app-build/www && tar xf -)
          if [ ! -f app-build/www/index.html ]; then
            echo "ERROR: index.html must be at the top of the repository"
            exit 1
          fi

      - name: Create the Android project
        working-directory: app-build
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/app@^8 @capacitor/assets@^4
          npx cap init "EngCalc" com.mdarifulislam.engcalc --web-dir www
          npx cap add android
          ICON=$(ls www/icons/*512*.png www/icons/*.png www/*.png 2>/dev/null | head -1 || true)
          if [ -n "$ICON" ]; then
            mkdir -p assets
            cp "$ICON" assets/icon-only.png
            npx capacitor-assets generate --android --iconBackgroundColor '#0a1626' --splashBackgroundColor '#0a1626'
          fi
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - name: Build debug APK
        working-directory: app-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/EngCalc-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EngCalc-debug-apk
          path: EngCalc-debug.apk

      - name: Build signed release (only after adding the 4 secrets)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app-build/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/EngCalc-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/EngCalc-release.aab"

      - name: Upload signed release
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: EngCalc-release
          path: |
            EngCalc-release.apk
            EngCalc-release.aab
